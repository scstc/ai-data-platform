<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1230" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Heiti SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1300" height="1230" fill="#ffffff"/>
  <text x="650" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#0f172a">端到端数据工程流程 · 原始数据 → 可训练数据集</text>
  <text x="650" y="70" text-anchor="middle" font-size="13" fill="#64748b">关联原始需求 20 项 · 标注 角色 / 需求# / 平台现状 / 产物</text>
  <rect x="400" y="84" width="500" height="26" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="650" y="101" text-anchor="middle" font-size="12.5" fill="#4338ca">跨切面贯穿全程：#5 访问安全(RBAC) · #11 数据血缘(produced_by / JobInput)</text>
  <rect x="150" y="128" width="300" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="300" y="156" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">原始数据源</text>
  <text x="620" y="153" text-anchor="start" font-size="12.5" font-weight="500" fill="#64748b">数据库 / 文件系统 / API / 对象存储</text>
  <line x1="300" y1="174" x2="300" y2="206" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="150" y="206" width="300" height="58" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="150" y="206" width="6" height="58" rx="3" fill="#16a34a"/>
  <text x="300" y="231" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1 · 数据接入</text>
  <text x="300" y="251" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">抽取 · 增量同步 · 格式转换</text>
  <text x="620" y="228" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：数据工程师 · 需求 #1 接入 · #2 类型 · #3 格式</text>
  <text x="620" y="248" text-anchor="start" font-size="12" font-weight="600" fill="#16a34a">已实现 · 数据接入页</text>
  <line x1="300" y1="264" x2="300" y2="300" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="150" y="300" width="300" height="58" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="150" y="300" width="6" height="58" rx="3" fill="#16a34a"/>
  <text x="300" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2 · 原始数据湖</text>
  <text x="300" y="345" text-anchor="middle" font-size="11.5" font-weight="500" fill="#64748b">S3 / HDFS · 多版本（草稿区）</text>
  <text x="620" y="322" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">需求 #17 版本 · #18 数据托管</text>
  <text x="620" y="342" text-anchor="start" font-size="12" font-weight="600" fill="#16a34a">已实现 · DatasetVersion + MinIO（hosted 引用外部 S3）</text>
  <path d="M300,358 L300,372 L185,372" fill="none" stroke="#64748b" stroke-width="1.8"/>
  <line x1="185" y1="437" x2="230" y2="437" stroke="#64748b" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="230" y="400" width="360" height="74" rx="9" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <rect x="230" y="400" width="6" height="74" rx="3" fill="#d97706"/>
  <text x="250" y="430" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">数据安全扫描</text>
  <text x="250" y="452" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">内容审核 · 脱敏 · 分级分类</text>
  <text x="620" y="431" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：数据工程师 / 审核员 · 需求 #4（通过性指标） #15</text>
  <text x="620" y="450" text-anchor="start" font-size="12" font-weight="600" fill="#d97706">部分：内容审核(打标)已实现 · 脱敏=加工算子 · 分级=元信息</text>
  <text x="250" y="496" text-anchor="start" font-size="12" font-weight="600" fill="#b45309">└→ 命中打标 + 审核记录 → scanVerdict</text>
  <line x1="185" y1="557" x2="230" y2="557" stroke="#64748b" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="230" y="520" width="360" height="74" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="230" y="520" width="6" height="74" rx="3" fill="#16a34a"/>
  <text x="250" y="550" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">3 · 数据质量评估</text>
  <text x="250" y="572" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">配置质量规则 · 生成报告</text>
  <text x="620" y="551" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：数据工程师 · 需求 #6 质量评估</text>
  <text x="620" y="570" text-anchor="start" font-size="12" font-weight="600" fill="#16a34a">已实现：逐条得分 + 可视化报告 + 阈值一键删除</text>
  <text x="250" y="616" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">└→ 低质数据：自动排除 / 返回清洗</text>
  <line x1="185" y1="677" x2="230" y2="677" stroke="#64748b" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="230" y="640" width="360" height="74" rx="9" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="230" y="640" width="6" height="74" rx="3" fill="#16a34a"/>
  <text x="250" y="670" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">4 · 数据加工</text>
  <text x="250" y="692" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">编排 DAG · 清洗/合成/增强/COT</text>
  <text x="620" y="671" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：数据工程师 · 需求 #7 清洗 · #8 增强 · #9 处理</text>
  <text x="620" y="690" text-anchor="start" font-size="12" font-weight="600" fill="#16a34a">已实现：拖拽流水线 · 212 算子 · 含隐私脱敏</text>
  <text x="250" y="736" text-anchor="start" font-size="12" font-weight="600" fill="#15803d">└→ 干净、增强后的数据集（新版本）</text>
  <line x1="185" y1="797" x2="230" y2="797" stroke="#64748b" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="230" y="760" width="360" height="74" rx="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="230" y="760" width="6" height="74" rx="3" fill="#94a3b8"/>
  <text x="250" y="790" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">5 · 数据标注</text>
  <text x="250" y="812" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">创建标注任务 · 标注 · 审核</text>
  <text x="620" y="791" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：标注员 / 审核员 · 需求 #12 标注</text>
  <text x="620" y="810" text-anchor="start" font-size="12" font-weight="600" fill="#94a3b8">规划中：单/多人 + 智能标注 + 人审（Label Studio 方向）</text>
  <text x="250" y="856" text-anchor="start" font-size="12" font-weight="600" fill="#64748b">└→ 带标签的训练集</text>
  <line x1="185" y1="917" x2="230" y2="917" stroke="#64748b" stroke-width="1.8" marker-end="url(#ag)"/>
  <rect x="230" y="880" width="360" height="74" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="230" y="880" width="6" height="74" rx="3" fill="#2563eb"/>
  <text x="250" y="910" text-anchor="start" font-size="15" font-weight="700" fill="#0f172a">6 · 数据集仓库发布</text>
  <text x="250" y="932" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">打标 · 分级 · 设置生命周期</text>
  <text x="620" y="911" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：数据工程师 · 需求 #13 元信息 #14 打标 #15 分级 #19 生命周期</text>
  <text x="620" y="930" text-anchor="start" font-size="12" font-weight="600" fill="#2563eb">新增：版本级 publishStatus + 发布门（scanVerdict 须通过）</text>
  <text x="250" y="976" text-anchor="start" font-size="12" font-weight="600" fill="#1d4ed8">└→ 已发布 · 可训练版本</text>
  <line x1="185" y1="372" x2="185" y2="917" stroke="#64748b" stroke-width="1.8"/>
  <line x1="410" y1="954" x2="410" y2="1004" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <rect x="250" y="1004" width="360" height="56" rx="9" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="250" y="1004" width="6" height="56" rx="3" fill="#16a34a"/>
  <text x="430" y="1032" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">算法工程师 · 选为训练数据集</text>
  <text x="640" y="1028" text-anchor="start" font-size="12.5" font-weight="500" fill="#475569">角色：算法工程师</text>
  <text x="640" y="1046" text-anchor="start" font-size="12" font-weight="600" fill="#16a34a">仅消费「已发布」版本 · 草稿区不可见</text>
  <rect x="150" y="1110" width="1000" height="82" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="170" y="1136" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">平台现状图例</text>
  <rect x="170" y="1152" width="22" height="14" rx="3" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <rect x="170" y="1152" width="6" height="14" rx="3" fill="#16a34a"/>
  <text x="200" y="1163" text-anchor="start" font-size="12" font-weight="500" fill="#475569">已实现</text>
  <rect x="279" y="1152" width="22" height="14" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <rect x="279" y="1152" width="6" height="14" rx="3" fill="#d97706"/>
  <text x="309" y="1163" text-anchor="start" font-size="12" font-weight="500" fill="#475569">部分（需扩展/组合）</text>
  <rect x="479" y="1152" width="22" height="14" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <rect x="479" y="1152" width="6" height="14" rx="3" fill="#94a3b8"/>
  <text x="509" y="1163" text-anchor="start" font-size="12" font-weight="500" fill="#475569">规划中</text>
  <rect x="588" y="1152" width="22" height="14" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="588" y="1152" width="6" height="14" rx="3" fill="#2563eb"/>
  <text x="618" y="1163" text-anchor="start" font-size="12" font-weight="500" fill="#475569">本设计新增</text>
  <text x="170" y="1182" text-anchor="start" font-size="11.5" font-weight="500" fill="#64748b">说明：安全扫描/分级 与「数据集仓库发布」串成一道版本级发布门（只卡发布）；脱敏由数据加工的隐私算子执行后回到扫描复核。</text>
</svg>