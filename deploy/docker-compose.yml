# ai-data-platform 生产编排:PostgreSQL + 后端(含 data-juicer 引擎) + 前端(nginx) + kkFileView(文件预览)。
# 在仓库根目录执行:docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# kkFileView:独立预览服务,前端对非结构化格式(pdf/word/ppt/视频/音频/图片/...)统一走
#   http://<host>:${KK_PORT:-8012}/onlinePreview?url=${base64(presignedUrl)} 嵌入 iframe。
name: adp

services:
  postgres:
    image: postgres:16-alpine
    container_name: adp-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-adp}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-adp_dev_pw}
      POSTGRES_DB: ${PG_DB:-adp}
    # 发布到宿主机:供本地开发后端直连这套部署库(默认 55433,与 dev 约定一致)
    ports:
      - "${PG_PORT:-55433}:5432"
    volumes:
      - adp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-adp} -d ${PG_DB:-adp}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: adp-backend:latest
    container_name: adp-backend
    # &backend_env:后端与 worker 共享同一套环境(worker 服务 <<: *backend_env 复用),
    # 避免两处漂移。JOB_EXECUTION_MODE 一并注入两者(见路线 C 执行层拆分)。
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://${PG_USER:-adp}:${PG_PASSWORD:-adp_dev_pw}@postgres:5432/${PG_DB:-adp}
      # 生产默认走独立 worker 进程执行任务(API 只入队);置 inline 可回退进程内执行。
      JOB_EXECUTION_MODE: ${JOB_EXECUTION_MODE:-worker}
      UPLOAD_DIR: /data/uploads
      DATASETS_DIR: /data/datasets
      DJ_PROCESS_BIN: /opt/dj/.venv/bin/dj-process
      ENGINE_NP: ${ENGINE_NP:-2}
      ENGINE_CONCURRENCY: ${ENGINE_CONCURRENCY:-3}
      # 同源部署本不需要 CORS,仍按主机来源放行以防直连
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://10.60.1.60"]}
      # 会话令牌签名密钥(#5 访问安全):务必在 deploy/.env 配真实值,
      # 否则回退源码内的 dev 默认(公开,可被伪造令牌)。非空 fallback 避免空值覆盖。
      AUTH_SECRET: ${AUTH_SECRET:-adp-dev-insecure-secret-change-me}
      # 文件管理(平台 MinIO 对象存储):留空则文件管理接口返回 503「未配置」
      STORAGE_MINIO_ENDPOINT: ${STORAGE_MINIO_ENDPOINT:-}
      STORAGE_MINIO_ACCESS_KEY: ${STORAGE_MINIO_ACCESS_KEY:-}
      STORAGE_MINIO_SECRET_KEY: ${STORAGE_MINIO_SECRET_KEY:-}
      # 可选 LLM(留空则后端走启发式)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 外部 S3 托管(#18)物化缓存:不设会回退 config.py 写死的开发机路径,
      # 缓存写进容器层(重建即丢、最多撑大 10GiB);显式落到 /data 卷
      HOSTED_CACHE_DIR: /data/hosted-cache
    volumes:
      - adp_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 任务执行 worker(路线 C):同后端镜像,不起 HTTP、不跑迁移(backend 负责),
  # 只 python -m app.worker 认领 PG 队列执行。共享 adp_data 卷(引擎产物 /data)与
  # 后端同套环境(<<: *backend_env,含 JOB_EXECUTION_MODE=worker)。DB/迁移未就绪时
  # worker 认领会失败并自动重试,故仅依赖 postgres 健康即可。
  worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: adp-backend:latest
    container_name: adp-worker
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend_env
      # worker 并发执行的任务数;0 = 沿用 ENGINE_CONCURRENCY
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-0}
      # LLM 算子经 /api/v1/llm-proxy/{job_id} 回连做用量计量(engine.py 注入
      # OPENAI_BASE_URL)。默认 127.0.0.1:18003 只在 backend 容器内成立;worker
      # 容器不起 HTTP,必须指向 backend 服务,否则 LLM 算子任务全部连接失败。
      LLM_PROXY_SELF_URL: http://backend:18003
    volumes:
      - adp_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: adp-frontend:latest
    container_name: adp-frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

  kkfileview:
    image: keking/kkfileview:latest
    container_name: adp-kkfileview
    ports:
      - "${KK_PORT:-8012}:8012"
    restart: unless-stopped

volumes:
  adp_pg_data:
  adp_data:
