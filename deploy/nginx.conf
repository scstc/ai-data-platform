# 前端静态托管 + /api 反代到后端容器(同源,前端请求均为相对 /api/v1/...)。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 数据集上传可能较大
    client_max_body_size 512m;

    # API:转发到后端容器(compose 服务名 backend),保留完整 /api 路径。
    # 用 Docker 内置 DNS(127.0.0.11)按 TTL 动态解析:proxy_pass 写死域名会在 nginx
    # 启动时解析一次并缓存,后端容器单独重建换 IP 后全部 /api 请求 502;
    # 改用变量触发运行时解析后无需重启 nginx。
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:18003;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 加工/质量任务可能耗时,放宽超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # kkFileView 同源反代:前端产物统一用相对路径 /kkfileview,任何部署环境免配置。
    # kkfileview 容器需设 KK_CONTEXT_PATH=/kkfileview(其页面静态资源为绝对路径,
    # 不设 context-path 剥前缀反代会 404)。同样走 Docker DNS 动态解析。
    location /kkfileview/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $kk_upstream http://kkfileview:8012;
        proxy_pass $kk_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Office 转 PDF 等转换可能较慢
        proxy_read_timeout 300s;
    }

    # MinIO 同源反代:presigned URL 为内部域名(http://minio:9000/...)时,前端经
    # toBrowserFileUrl 改写为 /minio/ 路径走这里。Host 必须固定为 minio:9000 与
    # 签名一致(SigV4 SignedHeaders=host),否则 MinIO 校验签名失败。
    # 生产等 MinIO 走宿主 IP 的形态不会生成 /minio/ 地址,此段不生效但无害。
    location /minio/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $minio_upstream http://minio:9000;
        rewrite ^/minio/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        # 大文件下载/预览
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA 入口不缓存:发版后浏览器立即拿到新产物引用,避免旧 JS 缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS 强制协商缓存(ETag 304):utoopack 的 chunk 文件名非内容哈希,
    # 发版同名换内容;无 Cache-Control 时浏览器启发式缓存会继续执行旧代码
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}
